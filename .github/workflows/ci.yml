name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Makes the CLI end-to-end suite a hard failure if `dist` is missing, instead of a
      # skip. A skipped test on a build server means the pipeline is vouching for
      # behaviour that nothing ran.
      CI: 'true'

    steps:
      - uses: actions/checkout@v5

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest first: a formatting or lint error should not wait behind a build.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
