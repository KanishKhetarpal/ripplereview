name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Makes the CLI end-to-end suite a hard failure if `dist` is missing, instead of a
      # skip. A skipped test on a build server means the pipeline is vouching for
      # behaviour that nothing ran.
      CI: 'true'

    steps:
      - uses: actions/checkout@v5

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest first: a formatting or lint error should not wait behind a build.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Runs the eval end to end against the offline stub. It cannot produce a meaningful
      # number without a model key, and it is not supposed to: what it proves is that the
      # harness still executes — corpus repositories build, both arms run, the scorecard
      # renders. A harness that silently stopped working would otherwise be discovered on
      # the day someone tried to produce the real number.
      - name: Eval harness smoke
        run: pnpm eval --runs 1
        env:
          LLM_PROVIDER: echo

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-scorecard
          path: eval/out/
          if-no-files-found: warn
