name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Makes the CLI end-to-end and database suites a hard failure if their dependency is
      # missing, instead of a skip. A skipped test on a build server means the pipeline is
      # vouching for behaviour that nothing ran.
      CI: 'true'
      DATABASE_URL: postgres://ripple:ripple@localhost:5432/ripplereview_test

    # A real PostgreSQL. The persistence tests assert things that belong to the database —
    # that the schema applies, that a foreign key cascades, that a text[] round-trips, that
    # a rolled-back transaction leaves nothing behind — and a mocked pool would only assert
    # that the SQL matches the SQL that was written.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ripple
          POSTGRES_PASSWORD: ripple
          POSTGRES_DB: ripplereview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ripple -d ripplereview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest first: a formatting or lint error should not wait behind a build.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Runs the eval end to end against the offline stub. It cannot produce a meaningful
      # number without a model key, and it is not supposed to: what it proves is that the
      # harness still executes — corpus repositories build, both arms run, the scorecard
      # renders. A harness that silently stopped working would otherwise be discovered on
      # the day someone tried to produce the real number.
      - name: Eval harness smoke
        run: pnpm eval --runs 1
        env:
          LLM_PROVIDER: echo

      # Builds the image on a runner that has a Docker daemon. Without this the Dockerfile
      # is only ever read, never executed — and the one thing it must get right, that git
      # is present at runtime, fails on the first review rather than at build time.
      - name: Build the Docker image
        run: docker build -t ripplereview:ci .

      - name: The image can actually run
        run: |
          set -euo pipefail
          docker run --rm ripplereview:ci --version
          # git is a runtime dependency the build stage does not need, so its absence
          # would go unnoticed until a review shelled out to it.
          docker run --rm --entrypoint git ripplereview:ci --version

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-scorecard
          path: eval/out/
          if-no-files-found: warn
